[project]
name = "cg-modeling"
version = "0.1.0"
description = "CG modeling experiments (TripoSplat image-to-3DGS validation)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub>=2.4.0",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "safetensors>=0.8.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "jupyterlab>=4.6.6",
]

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TripoSplat Viewer</title>
<style>
  :root {
    --bg: #0b0d12; --panel: #12151c; --panel-2: #1a1e27; --border: #262b36;
    --text: #e2e8f0; --muted: #8b95a7; --accent: #60a5fa; --error: #f87171;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    color: var(--text); font: 13px/1.5 system-ui, -apple-system, "Hiragino Sans", sans-serif; }
  #app { display: flex; width: 100%; height: 100%; }

  /* ---- sidebar ---- */
  #sidebar { width: 300px; flex: none; display: flex; flex-direction: column;
    background: var(--panel); border-right: 1px solid var(--border); }
  #sidebar header { display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 1px solid var(--border); }
  #sidebar h1 { font-size: 15px; font-weight: 600; }
  #root-dir { padding: 8px 16px; color: var(--muted); font-size: 11px; word-break: break-all;
    border-bottom: 1px solid var(--border); }
  #list { flex: 1; overflow-y: auto; padding: 8px; }
  .group { margin: 10px 8px 4px; color: var(--muted); font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .04em; }
  .item { display: flex; gap: 10px; align-items: center; width: 100%; padding: 8px;
    border: 1px solid transparent; border-radius: 8px; background: none; color: inherit;
    font: inherit; text-align: left; cursor: pointer; }
  .item:hover { background: var(--panel-2); }
  .item.active { background: var(--panel-2); border-color: var(--accent); }
  .thumb { width: 44px; height: 44px; flex: none; border-radius: 6px; background: #000 center/cover;
    border: 1px solid var(--border); }
  .item .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .sub { color: var(--muted); font-size: 11px; }
  .badge { display: inline-block; padding: 0 5px; margin-right: 4px; border-radius: 4px;
    background: #233149; color: #9cc3ff; font-size: 10px; font-weight: 600; text-transform: uppercase; }
  #empty { padding: 16px; color: var(--muted); }

  /* ---- stage ---- */
  #stage { position: relative; flex: 1; min-width: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  .overlay { position: absolute; pointer-events: none; }
  #toolbar { top: 12px; right: 12px; display: flex; gap: 6px; pointer-events: auto; flex-wrap: wrap;
    justify-content: flex-end; }
  .tool { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px;
    background: rgba(18, 21, 28, .85); color: var(--text); font: inherit; cursor: pointer; }
  .tool:hover { border-color: var(--accent); }
  button.tool[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  #info { left: 12px; bottom: 12px; max-width: min(460px, calc(100% - 24px)); padding: 10px 12px;
    border-radius: 8px; background: rgba(18, 21, 28, .85); border: 1px solid var(--border); }
  #info:empty { display: none; }
  #info .title { font-weight: 600; margin-bottom: 2px; word-break: break-all; }
  #info .row { color: var(--muted); font-size: 12px; }
  #hint { right: 12px; bottom: 12px; color: var(--muted); font-size: 11px; text-align: right; }
  #status { inset: 0; display: flex; flex-direction: column; gap: 12px; align-items: center;
    justify-content: center; color: var(--muted); }
  #status.hidden { display: none; }
  #status.error { color: var(--error); white-space: pre-wrap; text-align: center; padding: 32px; }
  #spinner { width: 34px; height: 34px; border: 3px solid #334155; border-top-color: var(--accent);
    border-radius: 50%; animation: spin .9s linear infinite; }
  #status.error #spinner { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #drop { inset: 0; display: none; align-items: center; justify-content: center; font-size: 16px;
    background: rgba(96, 165, 250, .12); border: 2px dashed var(--accent); color: var(--accent); }
  #drop.show { display: flex; }

  @media (max-width: 720px) {
    #app { flex-direction: column; }
    #sidebar { width: 100%; max-height: 38vh; border-right: 0; border-bottom: 1px solid var(--border); }
    #hint { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <header>
      <h1>TripoSplat Viewer</h1>
      <button class="tool" id="refresh" title="一覧を再読み込み">更新</button>
    </header>
    <div id="root-dir"></div>
    <div id="list"></div>
  </aside>

  <main id="stage">
    <div id="toolbar" class="overlay">
      <button class="tool" id="btn-rotate" aria-pressed="false" title="Space">自動回転</button>
      <button class="tool" id="btn-bg" title="B">背景</button>
      <button class="tool" id="btn-reset" title="R">視点リセット</button>
      <label class="tool" style="cursor:pointer">
        ファイルを開く<input id="file-input" type="file" accept=".ply,.splat" hidden>
      </label>
    </div>
    <div id="info" class="overlay"></div>
    <div id="hint" class="overlay">ドラッグ: 回転 · スクロール: ズーム · 右ドラッグ: 移動<br>
      .ply / .splat をドロップして直接表示</div>
    <div id="status" class="overlay"><div id="spinner"></div><div id="status-label">モデル一覧を読み込み中…</div></div>
    <div id="drop" class="overlay">ここに .ply / .splat をドロップ</div>
  </main>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.180.0/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/",
    "@sparkjsdev/spark": "https://unpkg.com/@sparkjsdev/spark@2.0.0/dist/spark.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";

const $ = (id) => document.getElementById(id);
const stage = $("stage");
const statusEl = $("status");
const statusLabel = $("status-label");
const infoEl = $("info");

// ---------------------------------------------------------------------------
// three.js + Spark scene
// ---------------------------------------------------------------------------

const BACKGROUNDS = [0x0b0d12, 0x3a3f4a, 0xf2f2f2];
let bgIndex = 0;

const scene = new THREE.Scene();
scene.background = new THREE.Color(BACKGROUNDS[bgIndex]);

const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 1000);
const HOME_POS = new THREE.Vector3(0, 0.3, 1.8);
camera.position.copy(HOME_POS);

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(window.devicePixelRatio);
stage.prepend(renderer.domElement);

const spark = new SparkRenderer({ renderer });
scene.add(spark);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 0.2;
controls.maxDistance = 50;
controls.autoRotateSpeed = 2.0;

// TripoSplat の PLY は -Y up・正面が横向きで保存されるので、上流の
// static/viewer/viewer.html と同じく yaw → X 軸 180° 反転で Three.js 座標 (+Y up) に合わせる。
const splatRoot = new THREE.Group();
splatRoot.rotation.x = Math.PI;
scene.add(splatRoot);
let splat = null;

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  camera.aspect = w / Math.max(h, 1);
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}
new ResizeObserver(resize).observe(stage);
resize();

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});

function resetView() {
  camera.position.copy(HOME_POS);
  controls.target.set(0, 0, 0);
  controls.update();
}

// ---------------------------------------------------------------------------
// UI helpers
// ---------------------------------------------------------------------------

function showStatus(msg, isError = false) {
  statusEl.classList.remove("hidden");
  statusEl.classList.toggle("error", isError);
  statusLabel.textContent = msg;
}
function hideStatus() { statusEl.classList.add("hidden"); }

const fmtMB = (bytes) => `${(bytes / 1024 / 1024).toFixed(1)} MB`;
const fileURL = (rel) => "/files/" + rel.split("/").map(encodeURIComponent).join("/");

function renderInfo(title, rows) {
  infoEl.replaceChildren();
  const t = document.createElement("div");
  t.className = "title";
  t.textContent = title;
  infoEl.append(t);
  for (const r of rows) {
    const d = document.createElement("div");
    d.className = "row";
    d.textContent = r;
    infoEl.append(d);
  }
}

function metaRows(meta) {
  if (!meta) return [];
  const rows = [];
  const p = meta.params || {};
  const parts = ["seed", "steps", "guidance_scale", "shift"]
    .filter((k) => p[k] !== undefined).map((k) => `${k}=${p[k]}`);
  if (parts.length) rows.push(parts.join(" · "));
  if (meta.device) rows.push(`device: ${meta.device}`);
  if (meta.timings_sec?.total !== undefined) rows.push(`生成時間: ${meta.timings_sec.total.toFixed(1)} s`);
  if (meta.input) rows.push(`入力: ${meta.input}`);
  return rows;
}

// ---------------------------------------------------------------------------
// Loading models
// ---------------------------------------------------------------------------

let loadToken = 0;

async function loadSplat(options, title, extraRows = []) {
  const token = ++loadToken;
  showStatus(`${title} を読み込み中…`);
  if (splat) {
    splatRoot.remove(splat);
    splat.dispose();
    splat = null;
  }
  const mesh = new SplatMesh(options);
  mesh.rotation.y = Math.PI / 2;  // 正面をカメラ (+Z) 側へ向ける
  try {
    await mesh.initialized;
  } catch (e) {
    if (token === loadToken) showStatus(`読み込みに失敗しました: ${title}\n${e?.message ?? e}`, true);
    mesh.dispose();
    return;
  }
  if (token !== loadToken) { mesh.dispose(); return; }  // 読み込み中に別モデルが選ばれた
  splat = mesh;
  splatRoot.add(mesh);
  const n = mesh.packedSplats?.numSplats ?? mesh.extSplats?.numSplats;
  const rows = [];
  if (n !== undefined) rows.push(`${n.toLocaleString()} gaussians`);
  renderInfo(title, rows.concat(extraRows));
  hideStatus();
}

function loadModel(model) {
  document.querySelectorAll(".item").forEach((el) =>
    el.classList.toggle("active", el.dataset.path === model.path));
  const params = new URLSearchParams(location.search);
  params.set("file", model.path);
  history.replaceState(null, "", `?${params}`);
  loadSplat({ url: fileURL(model.path) }, model.path,
            [`${model.format.toUpperCase()} · ${fmtMB(model.size)}`, ...metaRows(model.meta)]);
}

async function loadLocalFile(file) {
  if (!/\.(ply|splat)$/i.test(file.name)) {
    showStatus(`.ply / .splat ファイルを指定してください: ${file.name}`, true);
    return;
  }
  document.querySelectorAll(".item").forEach((el) => el.classList.remove("active"));
  const bytes = new Uint8Array(await file.arrayBuffer());
  loadSplat({ fileBytes: bytes, fileName: file.name }, file.name, [`ローカルファイル · ${fmtMB(file.size)}`]);
}

// ---------------------------------------------------------------------------
// Sidebar
// ---------------------------------------------------------------------------

let models = [];

function renderList() {
  const list = $("list");
  list.replaceChildren();
  if (!models.length) {
    const d = document.createElement("div");
    d.id = "empty";
    d.textContent = "モデルがありません。ノートブックで生成するか、.ply / .splat をドロップしてください。";
    list.append(d);
    return;
  }
  let lastGroup = null;
  for (const m of models) {
    if (m.group !== lastGroup) {
      lastGroup = m.group;
      const g = document.createElement("div");
      g.className = "group";
      g.textContent = m.group || "(root)";
      list.append(g);
    }
    const btn = document.createElement("button");
    btn.className = "item";
    btn.dataset.path = m.path;
    const thumb = document.createElement("div");
    thumb.className = "thumb";
    if (m.thumb) thumb.style.backgroundImage = `url("${fileURL(m.thumb)}")`;
    const text = document.createElement("div");
    text.style.minWidth = "0";
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = m.name;
    const sub = document.createElement("div");
    sub.className = "sub";
    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = m.format;
    sub.append(badge, `${fmtMB(m.size)} · ${new Date(m.mtime * 1000).toLocaleString()}`);
    text.append(name, sub);
    btn.append(thumb, text);
    btn.addEventListener("click", () => loadModel(m));
    list.append(btn);
  }
}

async function refreshList(selectInitial = false) {
  try {
    const res = await fetch("/api/files", { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    models = data.models;
    $("root-dir").textContent = data.root;
  } catch (e) {
    showStatus(`モデル一覧の取得に失敗しました: ${e.message}`, true);
    return;
  }
  renderList();
  if (splat) {
    const current = new URLSearchParams(location.search).get("file");
    document.querySelectorAll(".item").forEach((el) =>
      el.classList.toggle("active", el.dataset.path === current));
  }
  if (!selectInitial) return;
  const wanted = new URLSearchParams(location.search).get("file");
  const initial = models.find((m) => m.path === wanted)
    ?? [...models].sort((a, b) => b.mtime - a.mtime)[0];  // 指定が無ければ最新のモデル
  if (initial) loadModel(initial);
  else showStatus("モデルがありません。ノートブックで生成してから「更新」を押してください。");
}

// ---------------------------------------------------------------------------
// Controls
// ---------------------------------------------------------------------------

const rotateBtn = $("btn-rotate");
function toggleRotate() {
  controls.autoRotate = !controls.autoRotate;
  rotateBtn.setAttribute("aria-pressed", String(controls.autoRotate));
}
function cycleBackground() {
  bgIndex = (bgIndex + 1) % BACKGROUNDS.length;
  scene.background.set(BACKGROUNDS[bgIndex]);
}

rotateBtn.addEventListener("click", toggleRotate);
$("btn-bg").addEventListener("click", cycleBackground);
$("btn-reset").addEventListener("click", resetView);
$("refresh").addEventListener("click", () => refreshList(false));
$("file-input").addEventListener("change", (e) => {
  const f = e.target.files?.[0];
  if (f) loadLocalFile(f);
  e.target.value = "";
});

window.addEventListener("keydown", (e) => {
  if (e.target instanceof HTMLInputElement) return;
  if (e.code === "Space") { e.preventDefault(); toggleRotate(); }
  else if (e.key === "r" || e.key === "R") resetView();
  else if (e.key === "b" || e.key === "B") cycleBackground();
});

const dropEl = $("drop");
let dragDepth = 0;
window.addEventListener("dragenter", (e) => { e.preventDefault(); dragDepth++; dropEl.classList.add("show"); });
window.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; dropEl.classList.remove("show"); } });
window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("drop", (e) => {
  e.preventDefault();
  dragDepth = 0;
  dropEl.classList.remove("show");
  const f = e.dataTransfer?.files?.[0];
  if (f) loadLocalFile(f);
});

refreshList(true);
</script>
</body>
</html>
